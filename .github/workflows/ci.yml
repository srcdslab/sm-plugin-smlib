name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@v1.3.1
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check every stock is in the test plugin
        working-directory: addons/sourcemod/scripting
        run: |
          set -euo pipefail
          missing=0
          for function in $(grep -ohP '^(?!static\s+)stock\s*\w+ \K\w+(?=\()' include/smlib/*.inc); do
            if ! grep -Fq "$function" tests/test_compile-all.sp; then
              echo "::error::Stock function \"$function\" not found in tests/test_compile-all.sp. Please add it."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build test plugins
        working-directory: addons/sourcemod/scripting
        run: |
          set -euo pipefail
          # smlib is an include library: the test plugins catch a broken include, they are not packaged
          mkdir -p /tmp/tests
          for target in test_compile-all test_colors; do
            spcomp -i include -o /tmp/tests/"$target".smx tests/"$target".sp
          done

      - name: Create package
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/addons/sourcemod/scripting
          cp -R addons/sourcemod/scripting/include /tmp/package/addons/sourcemod/scripting/
          cp -R addons/sourcemod/gamedata /tmp/package/addons/sourcemod/

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: /tmp/package

  tag:
    name: Tag
    needs: build
    if: github.ref == 'refs/heads/transitional_syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Delete existing "latest" release and tag
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          # The tag may exist without a release, so delete it explicitly
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [build, tag]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/transitional_syntax')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ runner.os }}
          path: artifacts

      - name: Versioning
        run: |
          set -euo pipefail
          version="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          cd artifacts
          tar -czf "../${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tar.gz" .
          cd ..

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
